<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVQ - Escolha o ambiente</title>
    <meta name="theme-color" content="#FFFFFF">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/ambientes.css">
    <link rel="stylesheet" href="../css/tema.css">
    <!-- Modo noturno salvo neste navegador (js/tema.js): aplicado antes de desenhar a página -->
    <script>try { if (localStorage.getItem('gvq-tema') === 'escuro') document.documentElement.dataset.tema = 'escuro'; } catch (e) {}</script>
</head>
<body>
    <!-- Tela depois do login: a pessoa escolhe em qual ambiente entrar (js/ambientes.js) -->
    <header class="amb-topo">
        <img class="amb-logo" data-logo src="../assets/img/logo-gvq.png" alt="GVQ — Grupo Vilela de Queiroz">
        <div class="amb-acoes">
            <button type="button" class="btn btn-fantasma btn-sm btn-tema" data-trocar-tema aria-pressed="false">
                <svg class="icon icone-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <span data-rotulo>Modo noturno</span>
            </button>
            <button type="button" id="btn-sair" class="btn btn-fantasma btn-sm">
                <svg class="icon"><use href="../assets/img/icones.svg#sair"></use></svg><span>Sair</span>
            </button>
        </div>
    </header>

    <main class="amb">
        <h1 class="amb-titulo">Olá<span id="amb-nome"></span></h1>
        <p class="amb-descricao">Escolha o ambiente que você quer acessar.</p>
        <p id="amb-carregando" class="amb-carregando">Verificando seus acessos...</p>

        <div class="amb-grade" id="amb-grade" hidden>
            <article class="amb-card" id="amb-compras">
                <span class="amb-icone"><svg class="icon"><use href="../assets/img/icones.svg#caminhao"></use></svg></span>
                <h2>Compra de Gado</h2>
                <p>Pesagens, negociação, romaneios e acompanhamento das compras.</p>
                <p class="amb-aviso" data-aviso hidden></p>
                <div class="amb-card-acoes" data-acoes></div>
            </article>
            <article class="amb-card" id="amb-ordens">
                <span class="amb-icone"><svg class="icon"><use href="../assets/img/icones.svg#documento"></use></svg></span>
                <h2>Ordens de Compra</h2>
                <p>Solicitações, análise e emissão das Ordens de Compra e transferências.</p>
                <p class="amb-aviso" data-aviso hidden></p>
                <div class="amb-card-acoes" data-acoes></div>
            </article>
        </div>
    </main>

    <script type="module" src="../js/tema.js"></script>
    <script type="module" src="../js/ambientes.js"></script>
</body>
</html>
