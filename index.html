<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVQ - Ordens de Compra</title>
    <meta name="description" content="Solicitação e emissão de Ordens de Compra e transferência de gado do Grupo Vilela de Queiroz.">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-tela">
    <!-- Foto da Unsplash (licença livre), servida pelo CDN deles já no tamanho certo -->
    <aside class="auth-foto">
        <img src="https://images.unsplash.com/photo-1555070319-a51174cb9529?w=1400&q=75&auto=format&fit=crop"
            srcset="https://images.unsplash.com/photo-1555070319-a51174cb9529?w=900&q=75&auto=format&fit=crop 900w,
                    https://images.unsplash.com/photo-1555070319-a51174cb9529?w=1400&q=75&auto=format&fit=crop 1400w,
                    https://images.unsplash.com/photo-1555070319-a51174cb9529?w=2000&q=75&auto=format&fit=crop 2000w"
            sizes="50vw" alt="">
    </aside>
    <main class="auth">
        <div class="auth-card">
            <img class="auth-logo" src="assets/img/logo-gvq.png" alt="GVQ — Grupo Vilela de Queiroz">
            <h1 class="auth-titulo">Ordens de Compra</h1>

            <div class="tabs" role="tablist" aria-label="Acesso ao sistema">
                <button type="button" id="aba-entrar" class="tab ativa" role="tab" aria-selected="true" aria-controls="form-login">Entrar</button>
                <button type="button" id="aba-criar" class="tab" role="tab" aria-selected="false" aria-controls="form-cadastro">Criar acesso</button>
            </div>

            <form id="form-login" class="auth-form" role="tabpanel">
                <div class="form-group">
                    <label for="login_usuario">Usuário</label>
                    <div class="campo-icone">
                        <svg class="icon"><use href="assets/img/icones.svg#usuario"></use></svg>
                        <input type="text" id="login_usuario" required autocomplete="username" placeholder="nome.sobrenome" autocapitalize="none" spellcheck="false">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login_senha">Senha</label>
                    <div class="campo-icone">
                        <svg class="icon"><use href="assets/img/icones.svg#cadeado"></use></svg>
                        <input type="password" id="login_senha" required autocomplete="current-password">
                    </div>
                </div>
                <p id="erro-login" class="erro-form" role="alert"></p>
                <button type="submit" id="btn-entrar" class="btn btn-primario btn-lg btn-bloco">Entrar</button>
                <p class="auth-rodape">Esqueceu a senha? Peça ao analista para apagar seu acesso e crie um novo.</p>
            </form>

            <form id="form-cadastro" class="auth-form" role="tabpanel" hidden>
                <div class="form-group">
                    <label for="cadastro_nome">Nome e sobrenome</label>
                    <input id="cadastro_nome" required minlength="3" maxlength="100" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="cadastro_usuario">Seu usuário</label>
                    <input id="cadastro_usuario" readonly tabindex="-1" placeholder="gerado pelo nome" autocomplete="username">
                    <small class="ajuda">Use este usuário para entrar.</small>
                </div>
                <div class="form-group">
                    <label for="cadastro_senha">Senha (mínimo 8 caracteres)</label>
                    <input type="password" id="cadastro_senha" required minlength="8" maxlength="128" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="cadastro_confirmar">Confirme a senha</label>
                    <input type="password" id="cadastro_confirmar" required minlength="8" maxlength="128" autocomplete="new-password">
                </div>
                <p id="erro-cadastro" class="erro-form" role="alert"></p>
                <button type="submit" id="btn-criar" class="btn btn-primario btn-lg btn-bloco">Criar acesso</button>
            </form>
        </div>
    </main>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
